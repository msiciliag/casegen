name: casegen
description: Decisiones empresariales reales para practicar en el móvil.
publish_to: none
version: 0.3.0+4
environment:
  sdk: ^3.11.0
dependencies:
  audio_session: ^0.2.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.6
  sqflite: ^2.4.2
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - cases/
    - cases/fde/
    - editorial/feed.json
    - editorial/audio/
